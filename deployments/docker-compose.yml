services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: timemachine
      POSTGRES_PASSWORD: timemachine
      POSTGRES_DB: timemachine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timemachine"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment: &env
      APP_ENV: dev
      DATABASE_URL: postgres://timemachine:timemachine@db:5432/timemachine?sslmode=disable
      JWT_SECRET: dev-only-insecure-secret-change-me
    command: ["/app/migrate", "-direction=up"]

  backend:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      <<: *env
      APP_ENV: dev
      HTTP_ADDR: ":8080"
      FRONTEND_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:5173"
      MAX_ENABLED: "false"
      AI_ENABLED: "false"
      AI_PROVIDER: stub
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: